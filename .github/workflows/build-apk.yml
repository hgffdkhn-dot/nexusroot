name: Build APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build APK
        run: gradle assembleDebug

      - name: Check APK for old socket path
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          echo "Checking $APK_PATH for old socket path..."
          if unzip -p "$APK_PATH" classes*.dex 2>/dev/null | strings | grep -q "/dev/socket/nxr_daemon"; then
            echo "ERROR: APK still contains old socket path /dev/socket/nxr_daemon"
            echo "Please run './gradlew clean' and delete .gradle cache, then rebuild."
            exit 1
          fi
          echo "APK check passed: no old socket path found."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexusroot-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
